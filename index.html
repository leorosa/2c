<!DOCTYPE html>
<html lang='pt'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <meta name='description' content='2C: A minimal financial calculator.'>
    <title>Essencial HP 12c</title>
    <link href="https://fonts.cdnfonts.com/css/seven-segment" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #333;
            font-family: 'Seven Segment', monospace;
            padding: 20px;
        }

        .calculator-wrapper {
            position: relative;
            display: inline-block;
            width: 100%;
            max-width: 800px;
        }

        .calculator-wrapper img {
            display: block;
            width: 100%;
            height: auto;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        #display {
            position: absolute;
            top: 11.5%;
            left: 20%;
            width: 45%;
            height: 10%;
            
            background: transparent;
            color: #000;
            text-align: right;
            font-size: clamp(26pt, 36pt, 36pt);
            font-weight: bold;
            letter-spacing: 0.15em;
            border: none;
            outline: none;
            font-family: 'Seven Segment', monospace;
            padding-right: 2%;
        }

        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        input[type=number] {
            -moz-appearance: textfield;
        }

        .button-group {
            position: absolute;
            display: flex;
            gap: 1.5%;
            width: 52%;
            height: 10%;
            top: 35%;
            left: 32%;
            transform: translateX(-50%);
        }

        button {
            flex: 1;
            background: transparent;
            color: transparent;
            border: none;
            cursor: pointer;
            padding: 0;
            font-size: 0;
            transition: background 0.1s;
        }

        button:active {
            background: rgba(0, 0, 0, 0.15);
        }

        #clear {
            position: absolute;
            top: 23%;
            left: 84.5%;
            width: 4.5%;
            height: 5%;
            background: transparent;
            border: none;
            cursor: pointer;
        }

        #clear:active {
            background: rgba(0, 0, 0, 0.15);
        }

        @media (max-width: 600px) {
            body {
                padding: 10px;
            }

            .calculator-wrapper {
                max-width: 100vw;
            }
        }
    </style>
</head>
<body>
    <div class="calculator-wrapper">
        <img src='hp12c_platinum.jpg' alt='HP 12c Calculator'>
        <div class="overlay">
            <input type='number' step='any' id='display' value='0'>
            <div class="button-group">
                <button id='n' onclick='calc.setVar("n")' title='n'></button>
                <button id='i' onclick='calc.setVar("i")' title='i'></button>
                <button id='PV' onclick='calc.setVar("PV")' title='PV'></button>
                <button id='PMT' onclick='calc.setVar("PMT")' title='PMT'></button>
                <button id='FV' onclick='calc.setVar("FV")' title='FV'></button>
                <button id='CHS' onclick='calc.changeSign()' title='CHS'></button>
            </div>
            <button id='clear' onclick='calc.reset()' title='Clear'></button>
        </div>
    </div>

    <script>
        class FinancialCalculator {
            #state = {
                n: 0,
                i: 0,
                PV: 0,
                PMT: 0,
                FV: 0,
                newVal: false
            };

            #displayEl = document.getElementById('display');
            #varKeys = ['n', 'i', 'PV', 'PMT', 'FV'];

            constructor() {
                this.#displayEl.addEventListener('click', () => this.#onDisplayClick());
            }

            #onDisplayClick() {
                this.#displayEl.value = '';
                this.#state.newVal = true;
            }

            setVar(key) {
                if (this.#state.newVal) {
                    this.#state[key] = Number(this.#displayEl.value);
                    if (key === 'i') {
                        this.#state[key] /= 100;
                    }
                    this.#state.newVal = false;
                } else {
                    this.#calculate(key);
                }

                this.#updateDisplay(key);
            }

            #calculate(key) {
                if (key === 'n') {
                    // n = log((PMT + i*FV) / (PMT - PV)) / log(1 + i)
                    this.#state.n = Math.log(
                        (this.#state.PMT + this.#state.i * this.#state.FV) /
                        (this.#state.PMT - this.#state.PV)
                    ) / Math.log(1 + this.#state.i);
                } else if (key === 'i') {
                    this.#state.i = this.#solveForI();
                } else if (key === 'PV') {
                    // PV = -(FV + PMT * ((1+i)^n - 1) / i) / (1+i)^n
                    const factor = Math.pow(1 + this.#state.i, this.#state.n);
                    this.#state.PV = -(this.#state.FV + this.#state.PMT * (factor - 1) / this.#state.i) / factor;
                } else if (key === 'PMT') {
                    // PMT = -(FV + PV * (1+i)^n) / ((1+i)^n - 1) / i
                    const factor = Math.pow(1 + this.#state.i, this.#state.n);
                    this.#state.PMT = -(this.#state.FV + this.#state.PV * factor) / ((factor - 1) / this.#state.i);
                } else if (key === 'FV') {
                    // FV = -(PV * (1+i)^n + PMT * ((1+i)^n - 1) / i)
                    const factor = Math.pow(1 + this.#state.i, this.#state.n);
                    this.#state.FV = -(this.#state.PV * factor + this.#state.PMT * (factor - 1) / this.#state.i);
                }

                console.log(`${key}: ${this.#state[key]}`);
            }

            #solveForI() {
                // Regula Falsi Method (False Position)
                let i1 = 0.000001;
                let i2 = 10;
                let iMid = (i1 + i2) / 2;

                const residual = (i) => 
                    this.#state.FV + 
                    this.#state.PV * Math.pow(1 + i, this.#state.n) + 
                    this.#state.PMT * (Math.pow(1 + i, this.#state.n) - 1) / i;

                let res1 = residual(i1);
                let res2 = residual(i2);

                while (Math.abs(i1 - i2) > 0.001) {
                    let resMid = residual(iMid);
                    iMid = (i1 * res2 - i2 * res1) / (res2 - res1);
                    console.log(`i iteration: ${(100 * iMid).toFixed(2)}%`);

                    if (resMid * res1 > 0) {
                        i1 = iMid;
                        res1 = resMid;
                    } else {
                        i2 = iMid;
                        res2 = resMid;
                    }
                }

                return iMid;
            }

            #updateDisplay(key) {
                if (key === 'i') {
                    this.#displayEl.value = (100 * this.#state.i).toFixed(2);
                } else {
                    this.#displayEl.value = this.#state[key].toFixed(2);
                }

                const btn = document.getElementById(key);
                btn.classList.add('active');
                btn.title = `${key}: ${this.#state[key].toFixed(2)}`;
            }

            changeSign() {
                this.#state.n = -this.#state.n;
                this.#displayEl.value = this.#state.n.toFixed(2);
                const btn = document.getElementById('CHS');
                btn.classList.add('active');
            }

            reset() {
                this.#state = {
                    n: 0,
                    i: 0,
                    PV: 0,
                    PMT: 0,
                    FV: 0,
                    newVal: false
                };
                this.#displayEl.value = '0';
                this.#displayEl.style.background = 'transparent';
                
                this.#varKeys.forEach(key => {
                    const btn = document.getElementById(key);
                    btn.classList.remove('active');
                    btn.title = key + ': 0';
                });
            }
        }

        // Initialize calculator
        const calc = new FinancialCalculator();
    </script>
</body>
</html>
